{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">
                        Takım Üyesini Sil
                    </h1>

                    <p>
                        <strong>{{ team_member.name }}</strong>
                        adlı takım üyesini silmek istediğine emin misin?
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex gap-2 mt-4">
                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Evet, Sil
                            </button>

                            <a
                                href="{% url 'accounts:team_member_detail' team_member.pk %}"
                                class="btn btn-outline-secondary"
                            >
                                Vazgeç
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
