{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Satış Fırsatını Sil</h1>

                    <p class="mb-4">
                        <strong>{{ deal.title }}</strong>
                        satış fırsatını silmek istediğinize emin misiniz?
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                Evet, Sil
                            </button>

                            <a
                                href="{% url 'sales:detail' deal.pk %}"
                                class="btn btn-outline-secondary"
                            >
                                Vazgeç
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
