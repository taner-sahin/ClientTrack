{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4">
                        {% if form.instance.pk %}
                            Görüşmeyi Düzenle
                        {% else %}
                            Yeni Görüşme
                        {% endif %}
                    </h1>

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                Kaydet
                            </button>

                            <a href="{% url 'interactions:list' %}" class="btn btn-outline-secondary">
                                Vazgeç
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
