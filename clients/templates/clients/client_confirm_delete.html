{% extends "base.html" %}
{% block title %}Müşteriyi Sil | ClientTrack{% endblock %}

{% block content %}
<section class="ct-client-page">
    <div class="ct-client-form-shell">
        <div class="ct-client-page-header">
            <div>
                <span class="ct-section-label">MÜŞTERİ SİLME</span>
                <h1>Müşteriyi Sil</h1>
                <p>Bu işlem geri alınamaz.</p>
            </div>
            <a href="{% url 'clients:detail' client.pk %}" class="ct-client-back-link">
                ← Müşteri Detayına Dön
            </a>
        </div>

        <div class="ct-client-card">
            <h2 class="h5 mb-2">{{ client.name }}</h2>
            <p class="text-muted mb-4">Bu müşteri kaydını silmek istediğinizden emin misiniz?</p>

            <form method="post">
                {% csrf_token %}
                <div class="ct-client-actions">
                    <button type="submit" class="ct-danger-btn">Evet, Müşteriyi Sil</button>
                    <a href="{% url 'clients:detail' client.pk %}" class="ct-client-cancel-btn">İptal</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
