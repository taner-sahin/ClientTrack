{% extends "base.html" %}

{% block title %}Müşteriyi Sil | ClientTrack{% endblock %}

{% block content %}

<section class="ct-client-page">

    <div class="ct-client-form-shell">

        <div class="ct-client-page-header">

            <div>
                <span class="ct-section-label">
                    MÜŞTERİ SİLME
                </span>

                <h1>Müşteriyi Sil</h1>

                <p>
                    Bu işlem geri alınamaz.
                </p>
            </div>

            <a
                href="{% url 'clients:detail' client.pk %}"
                class="ct-client-back-link"
            >
                ← Müşteri Detayına Dön
            </a>

        </div>


        <div class="ct-client-card">

            <h2 class="h5 mb-3">
                {{ client.name }}
            </h2>

            <p class="text-muted mb-4">
                Bu müşteri kaydını silmek istediğinizden emin misiniz?
            </p>


            <form method="post">

                {% csrf_token %}

                <div class="d-flex gap-2">

                   
                    <div class="ct-client-delete-actions">

    <button
        type="submit"
        class="ct-client-confirm-delete-btn"
    >
        Evet, Müşteriyi Sil
    </button>

    <a
        href="{% url 'clients:detail' client.pk %}"
        class="ct-client-cancel-btn"
    >
        İptal
    </a>

</div>
                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
